<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krish Group Secure Dashboard</title>
  <style>
    body {
      background-color: #0d1117;
      color: #f0f6fc;
      font-family: "Segoe UI", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: #161b22;
      padding: 50px 40px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 380px;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 25px;
      background: linear-gradient(145deg, #b30000, #ff4d4d);
      border-radius: 16px;
      color: #fff;
      font-weight: bold;
      font-size: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(255, 77, 77, 0.4);
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    h1 {
      margin: 0;
      font-size: 1.9em;
      background: linear-gradient(90deg, #4da3ff, #0066ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    h2 {
      margin-top: 5px;
      font-size: 1.2em;
      background: linear-gradient(90deg, #00d084, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 600;
    }

    .button-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 30px;
    }

    button {
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      color: white;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    /* Orange for Accounting Portal */
    #accButton {
      background: linear-gradient(90deg, #ff8c1a, #ff6600);
    }

    /* Blue for Rent/Sales Portal */
    #rentButton {
      background: linear-gradient(90deg, #0969da, #1f6feb);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    }

    footer {
      position: fixed;
      bottom: 10px;
      font-size: 0.8em;
      color: #8b949e;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">KG</div>
    <h1>Krish Group</h1>
    <h2>Secure Portal</h2>

    <div class="button-container">
      <button id="accButton" onclick="window.open('https://portal.reckon.com/', '_blank')">
        Accounting Portal
      </button>
      <button id="rentButton" onclick="checkRentAccess()">
        Rent / Sales Portal
      </button>
    </div>
  </div>

  <footer>© 2025 Krish Group Ltd</footer>

  <script>
    // ✅ Allowed users for Rent/Sales Portal
    const allowedRentUsers = [
      "bsahil82@gmail.com",
      "pritibhatia880@gmail.com",
      "aesha149@gmail.com",
      "ravibhatia.krishgroup@gmail.com"
    ];

    // Get the stored email from login step (Cloudflare Worker/localStorage)
    const currentUser = (localStorage.getItem("currentUser") || "").trim().toLowerCase();

    function checkRentAccess() {
      if (allowedRentUsers.map(u => u.toLowerCase()).includes(currentUser)) {
        window.open("https://www.onsitepropertymanager.com/secure", "_blank");
      } else {
        alert("Access Denied: You are not authorized to open the Rent / Sales Portal.");
      }
    }
  </script>

</body>
</html>
