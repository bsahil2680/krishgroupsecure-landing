<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krish Group Secure Portal</title>
  <style>
    body {
      background-color: #0d1117;
      color: #f0f6fc;
      font-family: "Segoe UI", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
    }

    /* Top Banner */
    .banner {
      width: 100%;
      background-color: #ff4d4f;
      color: white;
      text-align: center;
      padding: 12px 0;
      font-weight: bold;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      font-size: 0.95em;
    }

    /* Container */
    .container {
      text-align: center;
      background-color: #161b22;
      padding: 50px 30px;
      border-radius: 15px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      width: 380px;
      margin-top: 90px; /* space for banner */
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo */
    .logo {
      width: 90px;
      height: 90px;
      margin-bottom: 25px;
      background: linear-gradient(145deg, #b30000, #ff4d4d);
      border-radius: 16px;
      color: #fff;
      font-weight: bold;
      font-size: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(255, 77, 77, 0.4);
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    h1 {
      font-size: 1.9em;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #4da3ff, #0066ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    h2 {
      font-size: 1.2em;
      margin-top: 0;
      background: linear-gradient(90deg, #00d084, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    p {
      margin-bottom: 15px;
      color: #c9d1d9;
    }

    input[type="password"] {
      padding: 12px;
      border: none;
      border-radius: 5px;
      width: 85%;
      margin-top: 10px;
      background-color: #0d1117;
      color: white;
      font-size: 1em;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      background: linear-gradient(90deg, #238636, #2ea043);
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
      font-weight: bold;
      font-size: 1em;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background-color: #2ea043;
      transform: translateY(-2px);
    }

    footer {
      position: fixed;
      bottom: 10px;
      font-size: 0.8em;
      color: #8b949e;
    }

    @media (max-width: 420px) {
      .container {
        width: 90%;
        padding: 40px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="banner">
    ⚠️ Reminder: For your security, open this portal in Incognito/Private mode.
  </div>

  <div class="container">
    <div class="logo">KG</div>
    <h1>Krish Group</h1>
    <h2>Secure Portal</h2>
    <p>Please enter your secure access password:</p>
    <input type="password" id="password" placeholder="Enter Password">
    <button onclick="checkPassword()">Enter Portal</button>
  </div>

  <footer>© 2025 Krish Group Ltd</footer>

  <script>
    function checkPassword() {
      const input = document.getElementById('password').value;
      const correctPassword = "Priti_ravi12(2007)"; // 🔒 CHANGE THIS
      if (input === correctPassword) {
        window.location.href = "dashboard.html"; // Redirect to main dashboard
      } else {
        alert("Incorrect password. Unauthorized access!");
      }
    }
  </script>

</body>
</html>
